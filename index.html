<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><link rel="manifest" href="manifest.json"><title>KEEPi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#07101e;color:#f7f9fc}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 100px}.top,.section{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.logo i{color:#63e6be;font-style:normal}.pill{background:#12213a;padding:8px 12px;border-radius:99px;font-size:12px}.hero{margin:28px 0 18px}.hero h1{font-size:34px;line-height:1.05;margin:0 0 10px}.muted{color:#91a3bb}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0e1a2d;border:1px solid #1b2b45;border-radius:20px;padding:17px}.big{font-size:27px;font-weight:800}.section{margin:25px 2px 10px}.item{display:flex;gap:13px;align-items:center;margin:10px 0}.ico{width:44px;height:44px;border-radius:14px;background:#183052;display:grid;place-items:center;font-size:21px}.grow{flex:1}.name{font-weight:700}.date{font-size:13px;color:#91a3bb}.days{font-weight:700;font-size:13px}.add{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);width:min(484px,calc(100% - 36px));border:0;border-radius:18px;background:#63e6be;color:#06110d;font-size:17px;font-weight:800;padding:17px}.empty{text-align:center;padding:25px;color:#91a3bb}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:flex-start;justify-content:center;z-index:50;overflow:hidden;padding-top:max(12px,env(safe-area-inset-top))}.sheet{width:min(520px,100%);background:#0e1a2d;border-radius:26px 26px 0 0;padding:22px;padding-bottom:max(22px,env(safe-area-inset-bottom));height:calc(100dvh - max(12px,env(safe-area-inset-top)));max-height:none;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.sheet::-webkit-scrollbar{display:none}.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:99px;background:#42536c;margin:-8px auto 14px}.sheet h2{margin:0 0 16px;position:sticky;top:-22px;z-index:5;background:#0e1a2d;padding:16px 0 10px}input,select{width:100%;margin:7px 0;padding:14px;border-radius:13px;border:1px solid #2a3d59;background:#081424;color:white;font-size:16px}.row{display:flex;gap:8px}.fieldlabel{display:block;font-weight:800;margin:15px 2px 1px}.firstlabel{margin-top:12px!important;font-size:16px;color:#f7f9fc}.hint{font-size:12px;color:#91a3bb;margin:0 2px 4px}.money{display:flex;align-items:center;border:1px solid #2a3d59;border-radius:13px;background:#081424;padding-left:14px}.money span{font-weight:800;color:#91a3bb}.money input{border:0;margin:0}.quick{width:100%;padding:11px;border-radius:12px;border:1px solid #2a3d59;background:#13223a;color:#63e6be;font-weight:700;margin:0 0 4px}.scan{display:block;text-align:center;border:1px dashed #46617f;border-radius:14px;padding:16px;margin-bottom:8px;font-weight:800;color:#63e6be}.save,.cancel{flex:1;padding:14px;border:0;border-radius:13px;font-weight:800}.save{background:#63e6be}.cancel{background:#26364d;color:white}</style></head><body><main class="app"><div class="top"><div class="logo">KEEP<i>i</i></div><div class="pill">Private • On device</div></div><div class="hero"><h1>Never miss<br>an important date.</h1><div class="muted">Warranties, subscriptions and documents — one calm place.</div></div><div class="stats"><div class="card"><div class="muted">Tracked</div><div class="big" id="count">0</div></div><div class="card"><div class="muted">Due in 30 days</div><div class="big" id="soon">0</div></div></div><div class="section"><b>Upcoming</b><span class="muted">Saved locally</span></div><div id="list"></div></main><button class="add" onclick="openM()">＋ Add to KEEPi</button><div class="modal" id="modal"><div class="sheet"><h2>Add to KEEPi</h2><label class="scan" for="photo">📷 Scan receipt / document</label><input id="photo" type="file" accept="image/*" capture="environment" style="display:none"><div id="photoName" class="muted" style="font-size:12px;margin:4px 2px 8px"></div><label class="fieldlabel firstlabel">Product / document name</label><input id="title" placeholder="e.g. Nintendo game card"><label class="fieldlabel">Category</label><select id="cat"><option>Warranty</option><option>Subscription</option><option>Document</option><option>Car</option><option>Home</option><option>Other</option></select><label class="fieldlabel" id="purchaseLabel">Purchase date</label><div class="hint" id="purchaseHint">When did you buy it?</div><input id="purchase" type="date"><label class="fieldlabel">Amount</label><div class="hint">How much did you pay? Optional.</div><div class="money"><span>CHF</span><input id="amount" inputmode="decimal" placeholder="0.00"></div><label class="fieldlabel" id="expiryLabel">Warranty ends</label><div class="hint" id="expiryHint">The last day of the warranty.</div><input id="date" type="date"><button type="button" class="quick" id="calcWarranty" onclick="setWarranty(2)">＋ Set 2-year warranty</button><label class="fieldlabel">Reminder</label><div class="hint">When should KEEPi remind you?</div><select id="remind"><option value="30">Remind 30 days before</option><option value="7">Remind 7 days before</option><option value="1">Remind 1 day before</option></select><div class="row"><button class="cancel" onclick="closeM()">Cancel</button><button class="save" onclick="save()">Save</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>let data=JSON.parse(localStorage.getItem('keepi')||'[]');const icons={Warranty:'🛡️',Subscription:'💳',Document:'📄',Car:'🚗',Home:'🏠',Other:'⏰'};function render(){let now=new Date();data.sort((a,b)=>a.date.localeCompare(b.date));count.textContent=data.length;soon.textContent=data.filter(x=>{let d=(new Date(x.date)-now)/864e5;return d>=0&&d<=30}).length;list.innerHTML=data.length?data.map((x,i)=>{let d=Math.ceil((new Date(x.date)-now)/864e5),s=d<0?'Expired':d===0?'Today':d+' days';return '<div class="card item" onclick="del('+i+')"><div class="ico">'+icons[x.cat]+'</div><div class="grow"><div class="name">'+esc(x.title)+'</div><div class="date">'+x.cat+' • '+x.date+'</div></div><div class="days">'+s+'</div></div>'}).join(''):'<div class="card empty">Nothing tracked yet.<br>Add your first important date.</div>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openM(){modal.style.display='flex';document.body.style.overflow='hidden';setTimeout(()=>{document.querySelector('.sheet').scrollTop=0},0)}function closeM(){modal.style.display='none';document.body.style.overflow=''}function save(){let t=title.value.trim();if(!t||!date.value)return alert('Add a name and date');data.push({title:t,cat:cat.value,date:date.value,purchase:purchase.value,amount:amount.value,remind:remind.value,photo:photo.files[0]?photo.files[0].name:''});localStorage.setItem('keepi',JSON.stringify(data));title.value='';date.value='';purchase.value='';amount.value='';photo.value='';photoName.textContent='';closeM();render()}function del(i){if(confirm('Delete this reminder?')){data.splice(i,1);localStorage.setItem('keepi',JSON.stringify(data));render()}}cat.addEventListener('change',labels);function labels(){let v=cat.value,p='Purchase date',ph='When did you buy it?',e='Expiry / renewal date',eh='When does it expire or renew?';if(v==='Warranty'){e='Warranty ends';eh='The last day your warranty is valid.'}if(v==='Subscription'){p='Subscription start date';ph='When did the subscription start?';e='Next renewal date';eh='When will you be charged again?'}if(v==='Document'){p='Issue date';ph='When was the document issued?';e='Expiry date';eh='When does the document expire?'}if(v==='Car'){p='Start / service date';ph='Last relevant date.';e='Next due date';eh='Next service, inspection or renewal.'}purchaseLabel.textContent=p;purchaseHint.textContent=ph;expiryLabel.textContent=e;expiryHint.textContent=eh;calcWarranty.style.display=v==='Warranty'?'block':'none'}function setWarranty(y){if(!purchase.value)return alert('First choose the purchase date');let d=new Date(purchase.value+'T12:00:00');d.setFullYear(d.getFullYear()+y);date.value=d.toISOString().slice(0,10)}labels();photo.addEventListener('change',async()=>{const file=photo.files[0];if(!file)return;photoName.textContent='⏳ Reading document…';try{const r=await Tesseract.recognize(file,'eng+fra+deu+ita');const txt=r.data.text||'';photoName.textContent='✓ Document scanned';const dates=[...txt.matchAll(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})\b/g)].map(m=>{let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}).filter(x=>!isNaN(Date.parse(x)));if(dates.length){purchase.value=dates[0];if(dates.length>1)date.value=dates[dates.length-1]}const money=[...txt.matchAll(/(?:CHF|Fr\.?|EUR|€)\s*([0-9]+(?:[.,][0-9]{2})?)/gi)];if(money.length)amount.value=money[money.length-1][1].replace(',','.');const lines=txt.split('\n').map(x=>x.trim()).filter(x=>x.length>2&&x.length<60);if(!title.value&&lines.length)title.value=lines[0].slice(0,50)}catch(e){photoName.textContent='Could not read automatically — fill in manually.'}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
