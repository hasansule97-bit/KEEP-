<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><link rel="manifest" href="manifest.json"><title>KEEPi</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#07101e;color:#f7f9fc}.app{max-width:520px;margin:auto;min-height:100vh;padding:24px 18px 100px}.top,.section{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:900}.logo i{color:#63e6be;font-style:normal}.pill{background:#12213a;padding:8px 12px;border-radius:99px;font-size:12px}.hero{margin:28px 0 18px}.hero h1{font-size:34px;line-height:1.05;margin:0 0 10px}.muted{color:#91a3bb}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0e1a2d;border:1px solid #1b2b45;border-radius:20px;padding:17px}.big{font-size:27px;font-weight:800}.section{margin:25px 2px 10px}.item{display:flex;gap:13px;align-items:center;margin:10px 0}.ico{width:44px;height:44px;border-radius:14px;background:#183052;display:grid;place-items:center;font-size:21px}.grow{flex:1}.name{font-weight:700}.date{font-size:13px;color:#91a3bb}.days{font-weight:700;font-size:13px}.add{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);width:min(484px,calc(100% - 36px));border:0;border-radius:18px;background:#63e6be;color:#06110d;font-size:17px;font-weight:800;padding:17px}.empty{text-align:center;padding:25px;color:#91a3bb}.modal{display:none;position:fixed;inset:0;background:#000a;align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#0e1a2d;border-radius:26px 26px 0 0;padding:22px}.sheet h2{margin-top:0}input,select{width:100%;margin:7px 0;padding:14px;border-radius:13px;border:1px solid #2a3d59;background:#081424;color:white;font-size:16px}.row{display:flex;gap:8px}.scan{display:block;text-align:center;border:1px dashed #46617f;border-radius:14px;padding:16px;margin-bottom:8px;font-weight:800;color:#63e6be}.save,.cancel{flex:1;padding:14px;border:0;border-radius:13px;font-weight:800}.save{background:#63e6be}.cancel{background:#26364d;color:white}</style></head><body><main class="app"><div class="top"><div class="logo">KEEP<i>i</i></div><div class="pill">Private • On device</div></div><div class="hero"><h1>Never miss<br>an important date.</h1><div class="muted">Warranties, subscriptions and documents — one calm place.</div></div><div class="stats"><div class="card"><div class="muted">Tracked</div><div class="big" id="count">0</div></div><div class="card"><div class="muted">Due in 30 days</div><div class="big" id="soon">0</div></div></div><div class="section"><b>Upcoming</b><span class="muted">Saved locally</span></div><div id="list"></div></main><button class="add" onclick="openM()">＋ Add to KEEPi</button><div class="modal" id="modal"><div class="sheet"><h2>Add to KEEPi</h2><label class="scan" for="photo">📷 Scan receipt / document</label><input id="photo" type="file" accept="image/*" capture="environment" style="display:none"><div id="photoName" class="muted" style="font-size:12px;margin:4px 2px 8px"></div><input id="title" placeholder="Product, company or document"><select id="cat"><option>Warranty</option><option>Subscription</option><option>Document</option><option>Car</option><option>Home</option><option>Other</option></select><input id="purchase" type="date" title="Purchase / start date"><input id="amount" inputmode="decimal" placeholder="Amount (optional)"><input id="date" type="date" title="Expiry / renewal date"><select id="remind"><option value="30">Remind 30 days before</option><option value="7">Remind 7 days before</option><option value="1">Remind 1 day before</option></select><div class="row"><button class="cancel" onclick="closeM()">Cancel</button><button class="save" onclick="save()">Save</button></div></div></div><script>let data=JSON.parse(localStorage.getItem('keepi')||'[]');const icons={Warranty:'🛡️',Subscription:'💳',Document:'📄',Car:'🚗',Home:'🏠',Other:'⏰'};function render(){let now=new Date();data.sort((a,b)=>a.date.localeCompare(b.date));count.textContent=data.length;soon.textContent=data.filter(x=>{let d=(new Date(x.date)-now)/864e5;return d>=0&&d<=30}).length;list.innerHTML=data.length?data.map((x,i)=>{let d=Math.ceil((new Date(x.date)-now)/864e5),s=d<0?'Expired':d===0?'Today':d+' days';return '<div class="card item" onclick="del('+i+')"><div class="ico">'+icons[x.cat]+'</div><div class="grow"><div class="name">'+esc(x.title)+'</div><div class="date">'+x.cat+' • '+x.date+'</div></div><div class="days">'+s+'</div></div>'}).join(''):'<div class="card empty">Nothing tracked yet.<br>Add your first important date.</div>'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openM(){modal.style.display='flex'}function closeM(){modal.style.display='none'}function save(){let t=title.value.trim();if(!t||!date.value)return alert('Add a name and date');data.push({title:t,cat:cat.value,date:date.value,purchase:purchase.value,amount:amount.value,remind:remind.value,photo:photo.files[0]?photo.files[0].name:''});localStorage.setItem('keepi',JSON.stringify(data));title.value='';date.value='';purchase.value='';amount.value='';photo.value='';photoName.textContent='';closeM();render()}function del(i){if(confirm('Delete this reminder?')){data.splice(i,1);localStorage.setItem('keepi',JSON.stringify(data));render()}}photo.addEventListener('change',()=>photoName.textContent=photo.files[0]?'✓ '+photo.files[0].name:'');render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
